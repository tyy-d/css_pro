name: Validate community branch
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_DATA_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Start isolated local Supabase
        run: npx supabase start > /tmp/css-pro-supabase.log 2>&1
      - name: Serve upload function
        run: |
          npx supabase functions serve upload-image > /tmp/css-pro-functions.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null --fail http://127.0.0.1:54321/auth/v1/health -H "apikey: $(npx supabase status -o json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).ANON_KEY))')"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: npm run test:integration
      - name: Stop local services
        if: always()
        run: npx supabase stop --no-backup
